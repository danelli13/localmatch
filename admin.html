<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LocalMatch Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

nav{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e9f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:15px;
}

.nav-link{
  text-decoration:none;
  color:#4f46e5;
  font-weight:600;
}

.wrap{
  max-width:1200px;
  margin:35px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border:1px solid #e2e7ef;
  border-radius:14px;
  padding:25px;
  box-shadow:0 5px 20px rgba(20,30,50,.04);
}

.login-card{
  max-width:450px;
  margin:80px auto;
}

h1{
  margin:0 0 8px;
}

p{
  color:#687386;
}

label{
  display:block;
  font-weight:700;
  margin:18px 0 7px;
}

input,
select{
  width:100%;
  border:1px solid #cfd6e2;
  border-radius:9px;
  padding:12px;
  font-size:16px;
  background:#fff;
}

input:focus,
select:focus{
  outline:2px solid #c7d2fe;
  border-color:#6366f1;
}

.btn{
  border:1px solid #d3d9e4;
  background:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn:hover{
  background:#f5f7fb;
}

.primary{
  background:#4f46e5;
  color:#fff;
  border-color:#4f46e5;
  width:100%;
  margin-top:20px;
  padding:13px;
}

.primary:hover{
  background:#4338ca;
}

.logout{
  color:#991b1b;
}

.hidden{
  display:none !important;
}

.error{
  color:#991b1b;
  background:#fef2f2;
  border:1px solid #fecaca;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
}

.success{
  color:#166534;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:25px 0;
}

.stat{
  background:#fff;
  border:1px solid #e2e7ef;
  border-radius:14px;
  padding:20px;
}

.stat b{
  font-size:28px;
  display:block;
  margin-top:5px;
}

.stat-label{
  color:#687386;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 200px;
  gap:15px;
  margin-bottom:20px;
}

.lead{
  border:1px solid #e1e5ec;
  border-radius:12px;
  padding:20px;
  margin-bottom:15px;
  background:#fff;
}

.lead-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.category{
  display:inline-block;
  background:#eef2ff;
  color:#3730a3;
  padding:5px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:700;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#fef3c7;
  color:#92400e;
  font-size:13px;
  font-weight:700;
}

.request{
  font-size:18px;
  font-weight:700;
  margin:14px 0;
}

.lead-details{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:15px;
}

.detail{
  color:#4b5563;
  font-size:14px;
}

.detail strong{
  display:block;
  color:#172033;
  margin-bottom:4px;
}

.lead-actions{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  color:#7c8797;
  padding:40px;
}

.small{
  font-size:12px;
  color:#7c8797;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .lead-details{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .stats{
    grid-template-columns:1fr;
  }

  .lead-details{
    grid-template-columns:1fr;
  }

  .lead-header{
    flex-direction:column;
  }

}

</style>

</head>

<body>

<nav>

  <div class="logo">
    LocalMatch Admin
  </div>

  <div class="nav-right">

    <a
      href="index.html"
      class="nav-link"
    >
      Customer Site
    </a>

    <button
      id="logoutBtn"
      class="btn logout hidden"
    >
      Log Out
    </button>

  </div>

</nav>


<!-- LOGIN -->

<section
  id="loginSection"
  class="card login-card"
>

  <h1>LocalMatch Admin</h1>

  <p>
    Sign in to manage LocalMatch customer leads.
  </p>

  <label for="loginEmail">
    Email
  </label>

  <input
    id="loginEmail"
    type="email"
    placeholder="Your email"
    autocomplete="email"
  >

  <label for="loginPassword">
    Password
  </label>

  <input
    id="loginPassword"
    type="password"
    placeholder="Your password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="btn primary"
  >
    Sign In
  </button>

  <div
    id="loginError"
    class="error hidden"
  ></div>

</section>


<!-- DASHBOARD -->

<main
  id="dashboard"
  class="wrap hidden"
>

  <div class="card">

    <h1>Lead Dashboard</h1>

    <p>
      Manage your LocalMatch customer requests.
    </p>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <span class="stat-label">
        Total Leads
      </span>

      <b id="total">
        0
      </b>

    </div>


    <div class="stat">

      <span class="stat-label">
        New
      </span>

      <b id="newCount">
        0
      </b>

    </div>


    <div class="stat">

      <span class="stat-label">
        Qualified
      </span>

      <b id="qualified">
        0
      </b>

    </div>


    <div class="stat">

      <span class="stat-label">
        Sold
      </span>

      <b id="sold">
        0
      </b>

    </div>

  </div>


  <!-- LEADS -->

  <div class="card">

    <div class="toolbar">

      <input
        id="search"
        type="text"
        placeholder="Search leads..."
      >

      <select id="statusFilter">

        <option value="all">
          All Statuses
        </option>

        <option value="new">
          New
        </option>

        <option value="qualified">
          Qualified
        </option>

        <option value="sold">
          Sold
        </option>

      </select>

    </div>


    <div id="message"></div>


    <div id="rows"></div>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* --------------------------------
   SUPABASE
-------------------------------- */

const SUPABASE_URL =
  'https://gbhyyvokowulxyqcbqvp.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_lGzDmYYU08rNJv_qHhKDhw__1qXsEWU';


/*
  IMPORTANT:
  We call our client "supabaseClient"
  instead of "supabase" so it does not
  conflict with the Supabase library.
*/

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* --------------------------------
   ELEMENTS
-------------------------------- */

const loginSection =
  document.getElementById(
    'loginSection'
  );

const dashboard =
  document.getElementById(
    'dashboard'
  );

const loginBtn =
  document.getElementById(
    'loginBtn'
  );

const logoutBtn =
  document.getElementById(
    'logoutBtn'
  );

const loginError =
  document.getElementById(
    'loginError'
  );

const search =
  document.getElementById(
    'search'
  );

const statusFilter =
  document.getElementById(
    'statusFilter'
  );

const rows =
  document.getElementById(
    'rows'
  );

const message =
  document.getElementById(
    'message'
  );


let leads = [];


/* --------------------------------
   LOGIN
-------------------------------- */

loginBtn.addEventListener(
  'click',
  login
);


async function login(){

  const email =
    document
      .getElementById('loginEmail')
      .value
      .trim();

  const password =
    document
      .getElementById('loginPassword')
      .value;


  loginError.classList.add(
    'hidden'
  );


  if(!email || !password){

    loginError.textContent =
      'Please enter your email and password.';

    loginError.classList.remove(
      'hidden'
    );

    return;
  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    'Signing in...';


  const {error} =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if(error){

    loginError.textContent =
      error.message;

    loginError.classList.remove(
      'hidden'
    );

    loginBtn.disabled = false;

    loginBtn.textContent =
      'Sign In';

    return;
  }


  showDashboard();

}


/* --------------------------------
   ENTER KEY LOGIN
-------------------------------- */

document
  .getElementById('loginPassword')
  .addEventListener(
    'keydown',
    function(e){

      if(e.key === 'Enter'){
        login();
      }

    }
  );


/* --------------------------------
   CHECK EXISTING SESSION
-------------------------------- */

supabaseClient.auth
  .getSession()
  .then(function(result){

    if(result.data.session){

      showDashboard();

    }

  });


/* --------------------------------
   SHOW DASHBOARD
-------------------------------- */

async function showDashboard(){

  loginSection.classList.add(
    'hidden'
  );

  dashboard.classList.remove(
    'hidden'
  );

  logoutBtn.classList.remove(
    'hidden'
  );

  await loadLeads();

}


/* --------------------------------
   LOAD LEADS
-------------------------------- */

async function loadLeads(){

  rows.innerHTML =
    '<div class="empty">Loading leads...</div>';


  const {data,error} =
    await supabaseClient
      .from('leads')
      .select('*')
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  if(error){

    rows.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }


  leads =
    data || [];


  updateStats();

  renderLeads();

}


/* --------------------------------
   STATS
-------------------------------- */

function updateStats(){

  document
    .getElementById('total')
    .textContent =
      leads.length;


  document
    .getElementById('newCount')
    .textContent =
      leads.filter(
        lead => lead.status === 'new'
      ).length;


  document
    .getElementById('qualified')
    .textContent =
      leads.filter(
        lead => lead.status === 'qualified'
      ).length;


  document
    .getElementById('sold')
    .textContent =
      leads.filter(
        lead => lead.status === 'sold'
      ).length;

}


/* --------------------------------
   RENDER LEADS
-------------------------------- */

function renderLeads(){

  const searchText =
    search.value
      .toLowerCase()
      .trim();


  const selectedStatus =
    statusFilter.value;


  const filtered =
    leads.filter(function(lead){

      const searchable = [

        lead.category,

        lead.request,

        lead.zip,

        lead.name,

        lead.phone,

        lead.email,

        lead.budget,

        lead.timeline

      ]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();


      const matchesSearch =
        !searchText ||
        searchable.includes(
          searchText
        );


      const matchesStatus =
        selectedStatus === 'all' ||
        lead.status === selectedStatus;


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  if(filtered.length === 0){

    rows.innerHTML =
      '<div class="empty">' +
      'No leads found.' +
      '</div>';

    return;
  }


  rows.innerHTML =
    filtered
      .map(renderLead)
      .join('');


  document
    .querySelectorAll(
      '[data-advance-id]'
    )
    .forEach(function(button){

      button.addEventListener(
        'click',
        function(){

          advanceLead(
            button.dataset.advanceId
          );

        }
      );

    });

}


/* --------------------------------
   RENDER ONE LEAD
-------------------------------- */

function renderLead(lead){

  const category =
    lead.category ||
    'Uncategorized';


  const nextLabel =
    lead.status === 'new'
      ? 'Mark Qualified'
      : lead.status === 'qualified'
        ? 'Mark Sold'
        : 'Reopen';


  return `

    <div class="lead">

      <div class="lead-header">

        <div>

          <span class="category">
            ${escapeHtml(category)}
          </span>

          <div class="small">
            LM-${escapeHtml(
              String(lead.id)
                .replace(/-/g,'')
                .slice(0,8)
                .toUpperCase()
            )}
          </div>

        </div>

        <span class="status">
          ${escapeHtml(
            lead.status || 'new'
          )}
        </span>

      </div>


      <div class="request">

        ${escapeHtml(
          lead.request ||
          'No request provided'
        )}

      </div>


      <div class="lead-details">


        <div class="detail">

          <strong>
            ZIP
          </strong>

          ${escapeHtml(
            lead.zip || ''
          )}

        </div>


        <div class="detail">

          <strong>
            Budget
          </strong>

          ${escapeHtml(
            lead.budget ||
            'Not specified'
          )}

        </div>


        <div class="detail">

          <strong>
            Timeline
          </strong>

          ${escapeHtml(
            lead.timeline ||
            ''
          )}

        </div>


        <div class="detail">

          <strong>
            Contact Preference
          </strong>

          ${escapeHtml(
            lead.contact_pref ||
            ''
          )}

        </div>


        <div class="detail">

          <strong>
            Name
          </strong>

          ${escapeHtml(
            lead.name ||
            ''
          )}

        </div>


        <div class="detail">

          <strong>
            Phone
          </strong>

          ${escapeHtml(
            lead.phone ||
            ''
          )}

        </div>


        <div class="detail">

          <strong>
            Email
          </strong>

          ${escapeHtml(
            lead.email ||
            ''
          )}

        </div>


        <div class="detail">

          <strong>
            Created
          </strong>

          ${formatDate(
            lead.created_at
          )}

        </div>


      </div>


      <div class="lead-actions">

        <button
          class="btn"
          data-advance-id="${escapeHtml(
            lead.id
          )}"
        >
          ${nextLabel}
        </button>

      </div>


    </div>

  `;

}


/* --------------------------------
   ADVANCE LEAD
-------------------------------- */

async function advanceLead(id){

  const lead =
    leads.find(
      item => String(item.id) === String(id)
    );


  if(!lead){
    return;
  }


  const nextStatus =
    lead.status === 'new'
      ? 'qualified'
      : lead.status === 'qualified'
        ? 'sold'
        : 'new';


  const {error} =
    await supabaseClient
      .from('leads')
      .update({
        status: nextStatus
      })
      .eq(
        'id',
        id
      );


  if(error){

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(
        error.message
      ) +
      '</div>';

    return;
  }


  message.innerHTML =
    '<div class="success">' +
    'Lead updated successfully.' +
    '</div>';


  await loadLeads();

}


/* --------------------------------
   SEARCH
-------------------------------- */

search.addEventListener(
  'input',
  renderLeads
);


statusFilter.addEventListener(
  'change',
  renderLeads
);


/* --------------------------------
   LOG OUT
-------------------------------- */

logoutBtn.addEventListener(
  'click',
  async function(){

    await supabaseClient.auth.signOut();


    dashboard.classList.add(
      'hidden'
    );

    loginSection.classList.remove(
      'hidden'
    );

    logoutBtn.classList.add(
      'hidden'
    );

    loginBtn.disabled = false;

    loginBtn.textContent =
      'Sign In';

  }
);


/* --------------------------------
   HELPERS
-------------------------------- */

function escapeHtml(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      function(match){

        return {

          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'

        }[match];

      }
    );

}


function formatDate(value){

  if(!value){
    return '';
  }

  return new Date(value)
    .toLocaleString();

}

</script>

</body>
</html>
