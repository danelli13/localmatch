<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LocalMatch Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

nav{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e9f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:15px;
}

.nav-link{
  color:#4f46e5;
  text-decoration:none;
  font-weight:700;
}

.wrap{
  max-width:1200px;
  margin:35px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border:1px solid #e2e7ef;
  border-radius:14px;
  padding:25px;
  box-shadow:0 5px 20px rgba(20,30,50,.04);
}

.login-card{
  max-width:450px;
  margin:80px auto;
}

h1{
  margin:0 0 8px;
}

p{
  color:#687386;
}

label{
  display:block;
  font-weight:700;
  margin:15px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #cfd6e2;
  border-radius:9px;
  font:inherit;
  background:#fff;
}

textarea{
  min-height:130px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:2px solid #c7d2fe;
  border-color:#6366f1;
}

.btn{
  border:1px solid #d3d9e4;
  background:#fff;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{
  background:#f5f7fb;
}

.primary{
  width:100%;
  margin-top:20px;
  padding:13px;
  background:#4f46e5;
  color:#fff;
  border-color:#4f46e5;
}

.primary:hover{
  background:#4338ca;
}

.logout{
  color:#991b1b;
}

.hidden{
  display:none !important;
}

.error{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
}

.success{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin:25px 0;
}

.stat{
  background:#fff;
  border:1px solid #e2e7ef;
  border-radius:14px;
  padding:20px;
}

.stat-label{
  color:#687386;
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:5px;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 200px;
  gap:15px;
  margin-bottom:20px;
}

.lead{
  background:#fff;
  border:1px solid #dfe5ee;
  border-radius:14px;
  padding:22px;
  margin-bottom:18px;
}

.lead-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.category{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#eef2ff;
  color:#3730a3;
  font-size:13px;
  font-weight:800;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#fef3c7;
  color:#92400e;
  font-size:13px;
  font-weight:800;
}

.lead-id{
  color:#7c8797;
  font-size:12px;
  margin-top:5px;
}

.request{
  font-size:19px;
  font-weight:800;
  margin:15px 0 20px;
}

.details{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.detail{
  font-size:14px;
  color:#4b5563;
}

.detail strong{
  display:block;
  color:#172033;
  margin-bottom:4px;
}

.notes-box{
  margin-top:25px;
  padding:20px;
  border:2px solid #e0e7ff;
  border-radius:12px;
  background:#fafbff;
}

.notes-title{
  margin:0 0 5px;
  font-size:18px;
  font-weight:800;
}

.notes-help{
  margin:0 0 15px;
  font-size:13px;
  color:#687386;
}

.case-grid{
  display:grid;
  grid-template-columns:1fr 280px;
  gap:18px;
  align-items:stretch;
}

.case-card{
  background:#fff;
  border:1px solid #dfe5ee;
  border-radius:10px;
  padding:16px;
}

.case-label{
  display:block;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#687386;
  margin-bottom:8px;
}

.notes-history{
  white-space:pre-wrap;
  line-height:1.6;
  color:#172033;
}

.notes-empty{
  color:#9aa3b2;
  font-style:italic;
}

.follow-up-complete{
  border-color:#bbf7d0;
  background:#f0fdf4;
}

.follow-up-complete .case-label{
  color:#166534;
}

.follow-up-date{
  font-size:19px;
  font-weight:800;
  color:#166534;
}

.follow-up-status{
  margin-top:6px;
  font-size:13px;
  font-weight:700;
  color:#15803d;
}

.follow-up-empty{
  border-color:#e2e7ef;
  background:#fff;
}

.follow-up-empty .follow-up-date{
  color:#9aa3b2;
  font-size:15px;
  font-weight:600;
}

.follow-up-empty .follow-up-status{
  color:#9aa3b2;
}

.notes-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.edit-case{
  background:#fff;
  color:#172033;
}

.save-notes{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.notes-editor{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #e5e9f0;
}

.notes-grid{
  display:grid;
  grid-template-columns:1fr 220px;
  gap:18px;
}

.empty{
  text-align:center;
  padding:40px;
  color:#7c8797;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .details{
    grid-template-columns:1fr 1fr;
  }

  .case-grid{
    grid-template-columns:1fr;
  }

  .notes-grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .stats{
    grid-template-columns:1fr;
  }

  .details{
    grid-template-columns:1fr;
  }

  .lead-top{
    flex-direction:column;
  }

}

</style>
</head>


<body>

<nav>

  <div class="logo">
    LocalMatch Admin
  </div>

  <div class="nav-right">

    <a
      href="index.html"
      class="nav-link"
    >
      Customer Site
    </a>

    <button
      id="logoutBtn"
      class="btn logout hidden"
    >
      Log Out
    </button>

  </div>

</nav>


<!-- LOGIN -->

<section
  id="loginSection"
  class="card login-card"
>

  <h1>LocalMatch Admin</h1>

  <p>
    Sign in to manage LocalMatch customer leads.
  </p>

  <label>
    Email
  </label>

  <input
    id="loginEmail"
    type="email"
    value=""
    autocomplete="email"
  >

  <label>
    Password
  </label>

  <input
    id="loginPassword"
    type="password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="btn primary"
  >
    Sign In
  </button>

  <div
    id="loginError"
    class="error hidden"
  ></div>

</section>


<!-- DASHBOARD -->

<main
  id="dashboard"
  class="wrap hidden"
>

  <div class="card">

    <h1>
      Lead Dashboard
    </h1>

    <p>
      Manage your LocalMatch customer requests.
    </p>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <span class="stat-label">
        Total Leads
      </span>

      <b id="total">0</b>
    </div>

    <div class="stat">
      <span class="stat-label">
        New
      </span>

      <b id="newCount">0</b>
    </div>

    <div class="stat">
      <span class="stat-label">
        Qualified
      </span>

      <b id="qualified">0</b>
    </div>

    <div class="stat">
      <span class="stat-label">
        Sold
      </span>

      <b id="sold">0</b>
    </div>

  </div>


  <!-- LEADS -->

  <div class="card">

    <div class="toolbar">

      <input
        id="search"
        type="text"
        placeholder="Search leads..."
      >

      <select id="statusFilter">

        <option value="all">
          All Statuses
        </option>

        <option value="new">
          New
        </option>

        <option value="qualified">
          Qualified
        </option>

        <option value="sold">
          Sold
        </option>

      </select>

    </div>


    <div id="message"></div>

    <div id="rows"></div>

  </div>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://gbhyyvokowulxyqcbqvp.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_lGzDmYYU08rNJv_qHhKDhw__1qXsEWU';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const loginSection =
  document.getElementById(
    'loginSection'
  );

const dashboard =
  document.getElementById(
    'dashboard'
  );

const loginBtn =
  document.getElementById(
    'loginBtn'
  );

const logoutBtn =
  document.getElementById(
    'logoutBtn'
  );

const loginError =
  document.getElementById(
    'loginError'
  );

const search =
  document.getElementById(
    'search'
  );

const statusFilter =
  document.getElementById(
    'statusFilter'
  );

const rows =
  document.getElementById(
    'rows'
  );

const message =
  document.getElementById(
    'message'
  );


let leads = [];


/* LOGIN */

loginBtn.addEventListener(
  'click',
  login
);


async function login(){

  const email =
    document
      .getElementById('loginEmail')
      .value
      .trim();

  const password =
    document
      .getElementById('loginPassword')
      .value;


  loginError.classList.add(
    'hidden'
  );


  if(!email || !password){

    loginError.textContent =
      'Please enter your email and password.';

    loginError.classList.remove(
      'hidden'
    );

    return;
  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    'Signing in...';


  const {error} =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    loginError.textContent =
      error.message;

    loginError.classList.remove(
      'hidden'
    );

    loginBtn.disabled = false;

    loginBtn.textContent =
      'Sign In';

    return;
  }


  showDashboard();

}


/* ENTER KEY */

document
  .getElementById('loginPassword')
  .addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        login();

      }

    }
  );


/* EXISTING SESSION */

supabaseClient.auth
  .getSession()
  .then(function(result){

    if(result.data.session){

      showDashboard();

    }

  });


/* SHOW DASHBOARD */

async function showDashboard(){

  loginSection.classList.add(
    'hidden'
  );

  dashboard.classList.remove(
    'hidden'
  );

  logoutBtn.classList.remove(
    'hidden'
  );

  await loadLeads();

}


/* LOAD LEADS */

async function loadLeads(){

  rows.innerHTML =
    '<div class="empty">Loading leads...</div>';


  const {data,error} =
    await supabaseClient
      .from('leads')
      .select('*')
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  if(error){

    rows.innerHTML =
      '<div class="error">' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }


  leads =
    data || [];


  updateStats();

  renderLeads();

}


/* STATS */

function updateStats(){

  document
    .getElementById('total')
    .textContent =
      leads.length;


  document
    .getElementById('newCount')
    .textContent =
      leads.filter(
        lead => lead.status === 'new'
      ).length;


  document
    .getElementById('qualified')
    .textContent =
      leads.filter(
        lead => lead.status === 'qualified'
      ).length;


  document
    .getElementById('sold')
    .textContent =
      leads.filter(
        lead => lead.status === 'sold'
      ).length;

}


/* RENDER LEADS */

function renderLeads(){

  const searchText =
    search.value
      .toLowerCase()
      .trim();


  const selectedStatus =
    statusFilter.value;


  const filtered =
    leads.filter(function(lead){

      const searchable = [

        lead.category,

        lead.request,

        lead.zip,

        lead.name,

        lead.phone,

        lead.email,

        lead.budget,

        lead.timeline,

        lead.notes

      ]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();


      const matchesSearch =
        !searchText ||
        searchable.includes(
          searchText
        );


      const matchesStatus =
        selectedStatus === 'all' ||
        lead.status === selectedStatus;


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  if(filtered.length === 0){

    rows.innerHTML =
      '<div class="empty">' +
      'No leads found.' +
      '</div>';

    return;
  }


  rows.innerHTML =
    filtered
      .map(renderLead)
      .join('');


  document
    .querySelectorAll(
      '[data-status-id]'
    )
    .forEach(function(button){

      button.addEventListener(
        'click',
        function(){

          advanceLead(
            button.dataset.statusId
          );

        }
      );

    });


  document
    .querySelectorAll(
      '[data-save-id]'
    )
    .forEach(function(button){

      button.addEventListener(
        'click',
        function(){

          saveNotes(
            button.dataset.saveId
          );

        }
      );

    });


  document
    .querySelectorAll(
      '[data-edit-id]'
    )
    .forEach(function(button){

      button.addEventListener(
        'click',
        function(){

          const editor =
            document.querySelector(
              `[data-editor-id="${button.dataset.editId}"]`
            );

          if(!editor){
            return;
          }

          editor.classList.toggle(
            'hidden'
          );

          button.textContent =
            editor.classList.contains('hidden')
              ? '✏️ Edit Case'
              : '✖️ Cancel';

        }
      );

    });

}


/* ONE LEAD */

function renderLead(lead){

  const category =
    lead.category ||
    'Uncategorized';


  let nextButton =
    'Mark Qualified';


  if(lead.status === 'qualified'){

    nextButton =
      'Mark Sold';

  }

  if(lead.status === 'sold'){

    nextButton =
      'Reopen';

  }


  const hasFollowUp =
    !!lead.follow_up_date;


  const followUpHtml =
    hasFollowUp

      ? `

        <div class="case-card follow-up-complete">

          <span class="case-label">
            Follow-Up
          </span>

          <div class="follow-up-date">
            📅 ${formatDateOnly(
              lead.follow_up_date
            )}
          </div>

          <div class="follow-up-status">
            ✓ Follow-up scheduled
          </div>

        </div>

      `

      : `

        <div class="case-card follow-up-empty">

          <span class="case-label">
            Follow-Up
          </span>

          <div class="follow-up-date">
            No follow-up scheduled
          </div>

          <div class="follow-up-status">
            Add a follow-up date when needed
          </div>

        </div>

      `;


  return `

    <div class="lead">

      <div class="lead-top">

        <div>

          <span class="category">
            ${escapeHtml(category)}
          </span>

          <div class="lead-id">
            LM-${escapeHtml(
              String(lead.id)
                .replace(/-/g,'')
                .slice(0,8)
                .toUpperCase()
            )}
          </div>

        </div>

        <span class="status">
          ${escapeHtml(
            lead.status || 'new'
          )}
        </span>

      </div>


      <div class="request">
        ${escapeHtml(
          lead.request ||
          'No request provided'
        )}
      </div>


      <div class="details">

        <div class="detail">
          <strong>ZIP</strong>
          ${escapeHtml(
            lead.zip || ''
          )}
        </div>

        <div class="detail">
          <strong>Budget</strong>
          ${escapeHtml(
            lead.budget ||
            'Not specified'
          )}
        </div>

        <div class="detail">
          <strong>Timeline</strong>
          ${escapeHtml(
            lead.timeline ||
            ''
          )}
        </div>

        <div class="detail">
          <strong>Contact Preference</strong>
          ${escapeHtml(
            lead.contact_pref ||
            ''
          )}
        </div>

        <div class="detail">
          <strong>Name</strong>
          ${escapeHtml(
            lead.name ||
            ''
          )}
        </div>

        <div class="detail">
          <strong>Phone</strong>
          ${escapeHtml(
            lead.phone ||
            ''
          )}
        </div>

        <div class="detail">
          <strong>Email</strong>
          ${escapeHtml(
            lead.email ||
            ''
          )}
        </div>

        <div class="detail">
          <strong>Created</strong>
          ${formatDate(
            lead.created_at
          )}
        </div>

      </div>


      <!-- SALES CASE DETAILS -->

      <div class="notes-box">

        <div class="notes-title">
          📝 Sales Case Details
        </div>

        <p class="notes-help">
          Your saved sales history and current follow-up status.
        </p>


        <div class="case-grid">

          <div class="case-card">

            <span class="case-label">
              Notes History
            </span>

            <div
              class="notes-history ${
                lead.notes
                  ? ''
                  : 'notes-empty'
              }"
            >
              ${escapeHtml(
                lead.notes ||
                'No notes added yet.'
              )}
            </div>

          </div>


          ${followUpHtml}

        </div>


        <div class="notes-actions">

          <button
            class="btn edit-case"
            data-edit-id="${escapeHtml(lead.id)}"
          >
            ✏️ Edit Case
          </button>


          <button
            class="btn"
            data-status-id="${escapeHtml(lead.id)}"
          >
            ${nextButton}
          </button>

        </div>


        <!-- EDIT CASE -->

        <div
          class="notes-editor hidden"
          data-editor-id="${escapeHtml(lead.id)}"
        >

          <div class="notes-grid">

            <div>

              <label>
                Add New Note
              </label>

              <textarea
                data-new-note-id="${escapeHtml(lead.id)}"
                placeholder="Enter a new note. Existing notes will be preserved."
              ></textarea>

            </div>


            <div>

              <label>
                Follow-Up Date
              </label>

              <input
                type="date"
                data-follow-id="${escapeHtml(lead.id)}"
                value="${escapeHtml(
                  lead.follow_up_date || ''
                )}"
              >

            </div>

          </div>


          <div class="notes-actions">

            <button
              class="btn save-notes"
              data-save-id="${escapeHtml(lead.id)}"
            >
              💾 Save Changes
            </button>

          </div>

        </div>

      </div>

    </div>

  `;

}


/* SAVE NOTES */

async function saveNotes(id){

  const newNoteField =
    document.querySelector(
      `[data-new-note-id="${id}"]`
    );


  const followField =
    document.querySelector(
      `[data-follow-id="${id}"]`
    );


  const newNote =
    newNoteField
      ? newNoteField.value.trim()
      : '';


  const followUp =
    followField
      ? followField.value
      : '';


  const lead =
    leads.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!lead){
    return;
  }


  const existingNotes =
    lead.notes
      ? lead.notes.trim()
      : '';


  /*
    IMPORTANT:

    Existing notes are NEVER replaced.

    A new note is appended to the
    existing history with a timestamp.
  */

  let combinedNotes =
    existingNotes;


  if(newNote){

    const timestamp =
      new Date().toLocaleString();


    if(combinedNotes){

      combinedNotes +=
        '\n\n' +
        timestamp +
        ' — ' +
        newNote;

    }else{

      combinedNotes =
        timestamp +
        ' — ' +
        newNote;

    }

  }


  const {error} =
    await supabaseClient
      .from('leads')
      .update({

        notes:
          combinedNotes || null,

        follow_up_date:
          followUp || null

      })
      .eq(
        'id',
        id
      );


  if(error){

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(
        error.message
      ) +
      '</div>';

    return;
  }


  lead.notes =
    combinedNotes || null;

  lead.follow_up_date =
    followUp || null;


  renderLeads();


  message.innerHTML =
    '<div class="success">' +
    'Sales case updated successfully.' +
    '</div>';

}


/* CHANGE STATUS */

async function advanceLead(id){

  const lead =
    leads.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!lead){
    return;
  }


  let nextStatus =
    'qualified';


  if(lead.status === 'qualified'){

    nextStatus =
      'sold';

  }


  if(lead.status === 'sold'){

    nextStatus =
      'new';

  }


  const {error} =
    await supabaseClient
      .from('leads')
      .update({

        status:
          nextStatus

      })
      .eq(
        'id',
        id
      );


  if(error){

    message.innerHTML =
      '<div class="error">' +
      escapeHtml(
        error.message
      ) +
      '</div>';

    return;
  }


  await loadLeads();


  message.innerHTML =
    '<div class="success">' +
    'Lead status updated successfully.' +
    '</div>';

}


/* SEARCH */

search.addEventListener(
  'input',
  renderLeads
);


statusFilter.addEventListener(
  'change',
  renderLeads
);


/* LOG OUT */

logoutBtn.addEventListener(
  'click',
  async function(){

    await supabaseClient.auth.signOut();

    dashboard.classList.add(
      'hidden'
    );

    loginSection.classList.remove(
      'hidden'
    );

    logoutBtn.classList.add(
      'hidden'
    );

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      'Sign In';

  }
);


/* HELPERS */

function escapeHtml(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,
    function(match){

      return {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[match];

    }
  );

}


function formatDate(value){

  if(!value){
    return '';
  }

  return new Date(value)
    .toLocaleString();

}


function formatDateOnly(value){

  if(!value){
    return '';
  }


  const parts =
    String(value).split('-');


  if(parts.length !== 3){
    return String(value);
  }


  return (
    parts[1] +
    '/' +
    parts[2] +
    '/' +
    parts[0]
  );

}
