<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Ditty Search | Business CRM</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#101828;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:850;font-size:22px}.logo span{color:#f2c230}.wrap{max-width:1180px;margin:34px auto;padding:0 20px}.card,.lead{background:white;border:1px solid #e3e8f0;border-radius:14px;padding:22px;box-shadow:0 5px 18px #10182808}.login{max-width:430px;margin:70px auto}.muted{color:#667085}.hidden{display:none!important}label{display:block;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfd6e2;border-radius:8px;font:inherit;background:white}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:8px;padding:11px 15px;font-weight:750;cursor:pointer;background:#4f46e5;color:white}button.secondary{background:white;color:#344054;border:1px solid #d0d5dd}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:white;border:1px solid #e4e7ec;border-radius:12px;padding:17px}.stat strong{display:block;font-size:27px;margin-top:5px}.toolbar{display:grid;grid-template-columns:1fr 210px;gap:12px;margin-bottom:16px}.lead{margin:14px 0}.leadhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-block;background:#eef2ff;color:#3730a3;padding:4px 9px;border-radius:30px;font-size:12px;font-weight:800}.details{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:18px 0}.detail small{display:block;color:#667085;margin-bottom:4px}.crm{border-top:1px solid #eaecf0;padding-top:16px;margin-top:16px;display:grid;grid-template-columns:1fr 180px 170px;gap:12px;align-items:end}.message{padding:12px;border-radius:8px;margin-top:14px;background:#eff8ff;color:#175cd3}.error{background:#fef3f2;color:#b42318}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:repeat(2,1fr)}.crm,.toolbar{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">Local<span>Match</span> <small style="font-size:13px;font-weight:500;color:#d0d5dd">Business CRM</small></div><button id="logout" class="secondary hidden">Sign out</button></header>
<main class="wrap">
<section id="login" class="card login"><h1>Business sign in</h1><p class="muted">Access the leads assigned to your business.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button style="width:100%;margin-top:20px">Sign in</button></form><div id="loginMessage" aria-live="polite"></div></section>
<section id="dashboard" class="hidden"><div class="top"><div><h1 id="businessName">Your leads</h1><p class="muted">Your team's assigned opportunities, follow-ups, and sales activity.</p></div><button class="secondary" id="refresh">Refresh leads</button></div>
<div class="stats"><div class="stat"><span class="muted">Assigned</span><strong id="total">0</strong></div><div class="stat"><span class="muted">New</span><strong id="newCount">0</strong></div><div class="stat"><span class="muted">Quoted</span><strong id="quotedCount">0</strong></div><div class="stat"><span class="muted">Won</span><strong id="wonCount">0</strong></div></div>
<div class="toolbar"><input id="search" placeholder="Search customer, ZIP, or request"><select id="filter"><option value="all">All lead statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>quoted</option><option>won</option><option>lost</option></select></div><div id="leads"><div class="card muted">Loading assigned leads…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const db=window.supabase.createClient('https://gbhyyvokowulxyqcbqvp.supabase.co','sb_publishable_lGzDmYYU08rNJv_qHhKDhw__1qXsEWU');
 const $=id=>document.getElementById(id);let assignments=[],business=null;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function message(el,text,error){el.className='message'+(error?' error':'');el.textContent=text}
 $('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){message($('loginMessage'),error.message,true);return}await start()});
 $('logout').addEventListener('click',async()=>{await db.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden')});
 $('refresh').addEventListener('click',load);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);
 async function start(){const {data:{user}}=await db.auth.getUser();if(!user)return;
 const {data:m,error}=await db.from('business_members').select('business_id,role,businesses(name,status)').eq('user_id',user.id).maybeSingle();
 if(error||!m||!m.businesses||m.businesses.status!=='active'){message($('loginMessage'),error?.message||'Your account is not yet linked to an active Little Ditty Search business. Contact the platform administrator.',true);await db.auth.signOut();return}
 business=m;$('businessName').textContent=m.businesses.name+' — Sales CRM';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await load()}
 async function load(){$('leads').innerHTML='<div class="card muted">Loading assigned leads…</div>';
 const {data,error}=await db.from('provider_leads').select('id,lead_id,status,outcome,notes,assigned_at,contacted_at,follow_up_at,leads(id,created_at,category,request,zip,budget,timeline,contact_pref,name,phone,email)').order('assigned_at',{ascending:false});
 if(error){$('leads').innerHTML='<div class="card message error">'+esc(error.message)+'</div>';return}assignments=data||[];render()}
 function render(){const term=$('search').value.toLowerCase(),status=$('filter').value;const visible=assignments.filter(a=>{const l=a.leads||{},hay=[l.name,l.email,l.phone,l.zip,l.request,l.category].join(' ').toLowerCase();return(!term||hay.includes(term))&&(status==='all'||a.status===status)});
 $('total').textContent=assignments.length;$('newCount').textContent=assignments.filter(a=>a.status==='new').length;$('quotedCount').textContent=assignments.filter(a=>a.status==='quoted').length;$('wonCount').textContent=assignments.filter(a=>a.status==='won').length;
 if(!visible.length){$('leads').innerHTML='<div class="card muted">No assigned leads match this view yet.</div>';return}
 $('leads').innerHTML=visible.map(a=>{const l=a.leads||{};return '<article class="lead" data-id="'+esc(a.id)+'"><div class="leadhead"><div><span class="pill">'+esc(l.category||'General request')+'</span><h2>'+esc(l.name||'Customer request')+'</h2><div class="muted">Received '+new Date(l.created_at).toLocaleString()+' · Assigned '+new Date(a.assigned_at).toLocaleDateString()+'</div></div><strong>'+esc((a.status||'new').toUpperCase())+'</strong></div><p style="font-size:17px">'+esc(l.request)+'</p><div class="details"><div class="detail"><small>Phone</small>'+esc(l.phone)+'</div><div class="detail"><small>Email</small>'+esc(l.email)+'</div><div class="detail"><small>ZIP</small>'+esc(l.zip)+'</div><div class="detail"><small>Preferred contact</small>'+esc(l.contact_pref||'Not specified')+'</div><div class="detail"><small>Budget / timing</small>'+esc(l.budget||'Not specified')+' · '+esc(l.timeline||'')+'</div></div><div class="crm"><div><label>CRM note</label><textarea data-notes>'+esc(a.notes||'')+'</textarea></div><div><label>Pipeline status</label><select data-status>'+['new','contacted','qualified','quoted','won','lost'].map(s=>'<option '+(a.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div><label>Follow-up date</label><input type="date" data-followup value="'+esc(a.follow_up_at?a.follow_up_at.slice(0,10):'')+'"></div></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button data-save>Save CRM update</button></div><div data-feedback aria-live="polite"></div></article>'}).join('');
 $('leads').querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>save(b.closest('[data-id]'))))}
 async function save(card){const id=card.dataset.id,old=assignments.find(a=>a.id===id),status=card.querySelector('[data-status]').value,notes=card.querySelector('[data-notes]').value.trim(),follow=card.querySelector('[data-followup]').value||null;
 const {error}=await db.from('provider_leads').update({status,notes,follow_up_at:follow,updated_at:new Date().toISOString(),contacted_at:status==='contacted'&&!old.contacted_at?new Date().toISOString():old.contacted_at}).eq('id',id);
 if(error){card.querySelector('[data-feedback]').textContent=error.message;return}
 const changes=[];if(status!==old.status)changes.push({activity_type:'status_change',old_value:old.status,new_value:status,body:'Pipeline status updated'});if(notes&&notes!==old.notes)changes.push({activity_type:'note',body:notes});if(follow!==(old.follow_up_at?old.follow_up_at.slice(0,10):null))changes.push({activity_type:'follow_up_set',new_value:follow,body:follow?'Follow-up scheduled':'Follow-up cleared'});
 if(changes.length){const {data:{user}}=await db.auth.getUser();const rows=changes.map(c=>({...c,business_id:business.business_id,provider_lead_id:id,actor_user_id:user.id}));const {error:activityError}=await db.from('lead_activity').insert(rows);if(activityError){card.querySelector('[data-feedback]').textContent='Saved, but activity history could not be recorded: '+activityError.message;await load();return}}
 card.querySelector('[data-feedback]').textContent='Saved successfully.';await load()}
 db.auth.getSession().then(({data})=>{if(data.session)start()});
})();
</script></body></html>
